<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Royale Prototype</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="hud">
      <div id="status">connecting…</div>
      <div id="stats"></div>
      <div id="perf"></div>

      <div id="damage"></div>
      <div id="indicators"></div>

      <div id="crosshair"><span></span><span></span><span></span><span></span></div>
      <div id="hitmarker"><span></span><span></span><span></span><span></span></div>

      <div id="vitals">
        <div class="bar" id="health"><i></i><b></b></div>
        <div class="bar" id="shield"><i></i><b></b></div>
      </div>

      <div id="weapon">
        <div class="name"></div>
        <div class="ammo"></div>
        <div class="reloading"></div>
      </div>

      <div id="inventory"></div>
      <div id="prompt"></div>
      <div id="usebar"><i></i></div>
      <div id="round"></div>
      <canvas id="minimap"></canvas>
      <div id="killfeed"></div>
      <div id="banner"></div>
      <div id="volume">
        <label for="volume-slider">vol</label>
        <input id="volume-slider" type="range" min="0" max="100" step="1" />
        <span id="volume-value"></span>
      </div>
      <div id="hint">click to capture the mouse — WASD move, shift sprint, space jump, R reload</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
