# Local/production-like stack for Project Riftfront.
#
#   docker compose up --build
#
# The client is served on http://localhost:8080 and talks to the game server on
# http://localhost:2567. Both are plain HTTP; put a TLS-terminating reverse proxy in
# front for any real deployment (WebSockets need `Upgrade`/`Connection` headers forwarded).

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: riftfront-server:latest
    restart: unless-stopped
    ports:
      - '${RIFTFRONT_SERVER_PORT:-2567}:2567'
    environment:
      NODE_ENV: production
      PORT: '2567'
      HOST: 0.0.0.0
      # Comma-separated browser origins, or '*' to allow any (development default).
      RIFTFRONT_ALLOWED_ORIGINS: ${RIFTFRONT_ALLOWED_ORIGINS:-*}
      RIFTFRONT_MIN_PLAYERS: ${RIFTFRONT_MIN_PLAYERS:-2}
      RIFTFRONT_MAX_PLAYERS: ${RIFTFRONT_MAX_PLAYERS:-8}
      RIFTFRONT_MATCH_DURATION_MS: ${RIFTFRONT_MATCH_DURATION_MS:-300000}
      RIFTFRONT_SCORE_LIMIT: ${RIFTFRONT_SCORE_LIMIT:-20}
      RIFTFRONT_COUNTDOWN_MS: ${RIFTFRONT_COUNTDOWN_MS:-5000}
      RIFTFRONT_RESPAWN_DELAY_MS: ${RIFTFRONT_RESPAWN_DELAY_MS:-3000}
      RIFTFRONT_RESULTS_MS: ${RIFTFRONT_RESULTS_MS:-10000}
      RIFTFRONT_ENABLE_MONITOR: ${RIFTFRONT_ENABLE_MONITOR:-false}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:2567/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        # Baked into the bundle at build time; change it and rebuild for a new host.
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:2567}
    image: riftfront-client:latest
    restart: unless-stopped
    ports:
      - '${RIFTFRONT_CLIENT_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
